name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build signed APKs + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: pdf_tech

      - name: Checkout files_tech_core (path dependency)
        uses: actions/checkout@v6
        with:
          repository: gitubpatrice/files_tech_core
          path: files_tech_core

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > pdf_tech/android/app/keystore.jks
          ls -la pdf_tech/android/app/keystore.jks

      - name: Pub get
        working-directory: pdf_tech
        run: flutter pub get

      # build.gradle.kts accepte les env vars PDFTECH_* (fallback key.properties).
      - name: Build APK release splits (signed)
        working-directory: pdf_tech
        env:
          PDFTECH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PDFTECH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PDFTECH_STORE_FILE: keystore.jks
          PDFTECH_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Build APK release universal (signed)
        working-directory: pdf_tech
        env:
          PDFTECH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PDFTECH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PDFTECH_STORE_FILE: keystore.jks
          PDFTECH_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APKs + SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          OUT=pdf_tech/build/app/outputs/flutter-apk
          mkdir -p release-assets

          # Splits ABI
          cp "$OUT/app-armeabi-v7a-release.apk" "release-assets/pdf-tech-armeabi-v7a-${VERSION}.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "release-assets/pdf-tech-arm64-v8a-${VERSION}.apk"
          cp "$OUT/app-x86_64-release.apk" "release-assets/pdf-tech-x86_64-${VERSION}.apk"

          # Universal
          cp "$OUT/app-release.apk" "release-assets/pdf-tech-universel-${VERSION}.apk"

          # Table SHA-256 pour la release note
          {
            echo "sha256_table<<EOF"
            echo "| APK | SHA-256 |"
            echo "|-----|---------|"
            for f in release-assets/*.apk; do
              name=$(basename "$f")
              hash=$(sha256sum "$f" | awk '{print $1}')
              echo "| \`$name\` | \`$hash\` |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PDF Tech ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## PDF Tech ${{ steps.version.outputs.VERSION }}

            ### Français
            - Build release signé avec les 4 variants ABI.
            - Voir le changelog complet ci-dessous.

            ### English
            - Signed release build with 4 ABI variants.
            - See full changelog below.

            ## Vérification d'intégrité / Integrity verification

            ${{ steps.sha.outputs.sha256_table }}

            Vérifiez avec / Verify with :
            ```bash
            sha256sum pdf-tech-*.apk
            ```

            ---
            🤖 Build automatique via GitHub Actions (commit `${{ github.sha }}`).
          files: release-assets/*.apk

      - name: Cleanup
        if: always()
        run: |
          rm -f pdf_tech/android/app/keystore.jks
          rm -rf release-assets
