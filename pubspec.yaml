name: pdf_tech
description: "Application de gestion de PDF - lecture, annotation, creation, partage"
publish_to: 'none'
version: 1.13.5+11305

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Code partage Files Tech (RecentFiles, UpdateService, CloudShareRow, etc.)
  # Dépendance git et non chemin relatif : `path: ../files_tech_core` ne résout que dans
  # l'arborescence de développement. Hors de celle-ci — un clone du dépôt, la CI, le buildserver
  # F-Droid — `pub get` échoue sur « could not find package files_tech_core ». L'application était
  # donc incompilable par quiconque n'a pas les dépôts frères côte à côte, ce qui contredit le fait
  # de publier les sources. Épinglé à un commit pour rester reproductible ; pass_tech procède ainsi
  # depuis sa v2.6.0.
  files_tech_core:
    git:
      url: https://github.com/gitubpatrice/files_tech_core.git
      ref: 4a69aa89a7a7bf6791a03692ca2dbdbb7e66efae

  # PDF - visualisation et manipulation
  syncfusion_flutter_pdfviewer: ^33.2.4
  syncfusion_flutter_pdf: ^33.2.4

  # Gestion des fichiers
  file_picker: ^11.0.0
  file_selector: ^1.1.0
  file_selector_android: ^0.5.2+9
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.1

  # Partage et email
  share_plus: ^10.0.3

  # Stockage local (fichiers recents) - conserve pour files_tech_core
  shared_preferences: ^2.3.2

  # Stockage local chiffre des metadonnees sensibles (recents, pages, cache
  # mise a jour, preferences). flutter_secure_storage utilise Keystore/Keychain.
  flutter_secure_storage: ^9.2.2

  # Signature electronique
  syncfusion_flutter_signaturepad: ^33.2.4

  # Google Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.0

  # Formatage des dates
  intl: ^0.20.0

  # OCR - rendu de pages PDF en images via pdfrx/pdfium + reconnaissance de
  # texte via Tesseract (open source, pas de code Google). `image` encode les
  # pixels bruts BGRA retournes par pdfrx_engine en PNG.
  pdfrx: ^2.4.7
  pdfrx_engine: ^0.4.6
  image: ^4.1.3
  flutter_tesseract_ocr: ^0.4.31

  # Liens externes (mailto / https)
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/logo_damier.png
    - assets/legal/
    - assets/tessdata/fra.traineddata
    - assets/tessdata/eng.traineddata
